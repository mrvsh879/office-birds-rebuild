name: Run final visual alignment
on:
  push:
    paths:
      - tools/final_visual_alignment.trigger
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/initial-rebuild
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: python tools/apply_final_visual_alignment.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/visual-game.js
          git diff --cached --quiet || git commit -m "Align game visuals with polished reference"
          git push origin HEAD:agent/initial-rebuild
