name: Apply inline office and scale patch
on:
  push:
    paths:
      - tools/apply_inline_office_and_scale_patch.py
      - .github/triggers/inline-office-scale.txt
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/initial-rebuild
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: python tools/apply_inline_office_and_scale_patch.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/visual-game.js
          git diff --cached --quiet || git commit -m "Apply inline office scene and visual scale"
          git push origin HEAD:agent/initial-rebuild
