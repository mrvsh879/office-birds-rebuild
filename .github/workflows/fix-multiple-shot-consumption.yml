name: Fix multiple shot consumption

on:
  push:
    branches: [agent/initial-rebuild]
    paths: [.github/workflows/fix-multiple-shot-consumption.yml]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/initial-rebuild
      - name: Patch mouse lifecycle and launch guard
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p=Path('src/visual-game.js')
          s=p.read_text()
          if 'ball.launchCounted=false' in s:
              raise SystemExit(0)

          s=s.replace(
            "ball.gameType='projectile';sling=Constraint.create",
            "ball.gameType='projectile';ball.launchCounted=false;sling=Constraint.create"
          )

          old="function setupMouse(){const mouse=Mouse.create(canvas);mouse.pixelRatio=render.options.pixelRatio;mouseConstraint=MouseConstraint.create(engine,{mouse,constraint:{stiffness:.18,damping:.12,render:{visible:false}}});Events.on(mouseConstraint,'startdrag',e=>{if(paused||levelFinished||e.body!==ball||detached)return;released=false;setStatus('Натяжение')});Events.on(mouseConstraint,'enddrag',e=>{if(paused||levelFinished||e.body!==ball||detached)return;const stretch=Vector.magnitude(Vector.sub(ball.position,anchor));if(stretch<45){setStatus('Потяни сильнее');return}released=true;shotsUsed++;shotStartedAt=performance.now();setStatus('Запуск');updateHud()});World.add(engine.world,mouseConstraint);render.mouse=mouse}"
          new="function setupMouse(){if(mouseConstraint){Events.off(mouseConstraint);if(mouseConstraint.mouse&&Mouse.clearSourceEvents)Mouse.clearSourceEvents(mouseConstraint.mouse);World.remove(engine.world,mouseConstraint);mouseConstraint=null}const mouse=Mouse.create(canvas);mouse.pixelRatio=render.options.pixelRatio;mouseConstraint=MouseConstraint.create(engine,{mouse,constraint:{stiffness:.18,damping:.12,render:{visible:false}}});Events.on(mouseConstraint,'startdrag',e=>{if(paused||levelFinished||e.body!==ball||detached||ball?.launchCounted)return;released=false;setStatus('Натяжение')});Events.on(mouseConstraint,'enddrag',e=>{if(paused||levelFinished||e.body!==ball||detached||ball?.launchCounted)return;const stretch=Vector.magnitude(Vector.sub(ball.position,anchor));if(stretch<45){setStatus('Потяни сильнее');return}ball.launchCounted=true;released=true;shotsUsed=Math.min(LEVELS[levelIndex].shots,shotsUsed+1);shotStartedAt=performance.now();setStatus('Запуск');updateHud()});World.add(engine.world,mouseConstraint);render.mouse=mouse}"
          if old not in s:
              raise SystemExit('setupMouse block not found')
          s=s.replace(old,new)

          p.write_text(s)
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/visual-game.js
          git commit -m "Prevent one drag release from consuming multiple heroes" || exit 0
          git push origin HEAD:agent/initial-rebuild
