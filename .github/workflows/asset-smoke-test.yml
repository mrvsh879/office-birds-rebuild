name: Asset smoke test

on:
  pull_request:
    branches:
      - rebuild-v2-clean

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: |
          node --check src/art-layer.js
          node --check src/game.js
          node --check src/world-assets.js
      - name: Install browser
        run: |
          npm init -y
          npm install playwright@1.54.1
          npx playwright install --with-deps chromium
      - name: Run browser smoke test
        run: |
          python3 -m http.server 4173 > /tmp/office-birds-server.log 2>&1 &
          cat > /tmp/smoke.mjs <<'EOF'
          import fs from 'node:fs';
          import { chromium } from 'playwright';
          let browser;
          const report = { state: null, errors: [], fatal: null };
          try {
            browser = await chromium.launch({ headless: true });
            const page = await browser.newPage({ viewport: { width: 1440, height: 900 } });
            page.on('pageerror', error => report.errors.push(`pageerror: ${error.message}`));
            page.on('console', message => {
              if (message.type() === 'error') report.errors.push(`console: ${message.text()}`);
            });
            const response = await page.goto('http://127.0.0.1:4173', { waitUntil: 'networkidle' });
            if (!response?.ok()) throw new Error(`HTTP ${response?.status()}`);
            await page.waitForTimeout(2500);
            report.state = await page.evaluate(() => ({
              hasMatter: Boolean(window.Matter),
              artInstalled: Boolean(window.officeBirdsArt?.overridesInstalled),
              worldInstalled: Boolean(window.officeBirdsWorldAssets?.installed),
              canvasWidth: document.querySelector('#gameCanvas')?.width || 0,
              canvasHeight: document.querySelector('#gameCanvas')?.height || 0,
              levelText: document.querySelector('#level')?.textContent || '',
              assetCount: Object.keys(window.officeBirdsWorldAssets?.assets || {}).length,
              loadedAssets: Object.values(window.officeBirdsWorldAssets?.assets || {}).filter(asset => asset.image?.complete && asset.image?.naturalWidth > 0).length,
            }));
            await page.screenshot({ path: 'office-birds-smoke.png', fullPage: true });
            const s = report.state;
            if (!s.hasMatter) throw new Error('Matter.js did not load');
            if (!s.artInstalled) throw new Error('Character art layer not installed');
            if (!s.worldInstalled) throw new Error('World asset layer not installed');
            if (!s.canvasWidth || !s.canvasHeight) throw new Error('Canvas was not initialized');
            if (!s.levelText.includes('/3')) throw new Error(`Unexpected level text: ${s.levelText}`);
            if (s.assetCount < 20) throw new Error(`Too few registered assets: ${s.assetCount}`);
            if (s.loadedAssets !== s.assetCount) throw new Error(`Only ${s.loadedAssets}/${s.assetCount} assets loaded`);
            if (report.errors.length) throw new Error(report.errors.join('\n'));
          } catch (error) {
            report.fatal = error?.stack || String(error);
          } finally {
            fs.writeFileSync('smoke-result.json', JSON.stringify(report, null, 2));
            if (browser) await browser.close();
          }
          console.log(JSON.stringify(report, null, 2));
          if (report.fatal) process.exit(1);
          EOF
          node /tmp/smoke.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: office-birds-smoke
          path: |
            office-birds-smoke.png
            smoke-result.json
            /tmp/office-birds-server.log
