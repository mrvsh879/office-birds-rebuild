name: Add destruction stage 1

on:
  push:
    branches: [agent/initial-rebuild]
    paths: [.github/workflows/add-destruction-stage1.yml]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/initial-rebuild
      - name: Patch destructible wood
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('src/visual-game.js')
          s = path.read_text()
          if 'function damageWood(' in s:
              print('Destruction stage already installed')
              raise SystemExit(0)

          old = "function makeBeam(x,y,w){const b=Bodies.rectangle(x,y,w,30,{density:.0024,friction:.72,frictionStatic:.9,frictionAir:.008,restitution:.03,chamfer:{radius:7},render:woodRender('beam')});b.gameType='structure';return b}\nfunction makePillar(x,y,h){const b=Bodies.rectangle(x,y,34,h,{density:.0027,friction:.75,frictionStatic:.95,frictionAir:.008,restitution:.02,chamfer:{radius:5},render:woodRender('pillar')});b.gameType='structure';return b}"
          new = "function setupWood(b,kind,w,h){b.gameType='structure';b.material='wood';b.woodKind=kind;b.woodWidth=w;b.woodHeight=h;b.maxHealth=kind==='beam'?105:125;b.health=b.maxHealth;b.damageState=0;b.breakable=true;b.isSupport=kind==='pillar';return b}\nfunction makeBeam(x,y,w){return setupWood(Bodies.rectangle(x,y,w,30,{density:.0024,friction:.72,frictionStatic:.9,frictionAir:.008,restitution:.03,chamfer:{radius:7},render:woodRender('beam')}),'beam',w,30)}\nfunction makePillar(x,y,h){return setupWood(Bodies.rectangle(x,y,34,h,{density:.0027,friction:.75,frictionStatic:.95,frictionAir:.008,restitution:.02,chamfer:{radius:5},render:woodRender('pillar')}),'pillar',34,h)}"
          if old not in s:
              raise SystemExit('Wood constructors not found')
          s = s.replace(old,new)

          marker = "function updateEffects(){for(const p of particles){p.x+=p.vx;p.y+=p.vy;p.vy+=.15;p.vx*=.98;p.life--}particles=particles.filter(p=>p.life>0);for(const r of impactRings){r.r+=3+r.power*.08;r.life--}impactRings=impactRings.filter(r=>r.life>0);flash*=.82}"
          extra = marker + "\nfunction updateWoodLook(body){const ratio=Math.max(0,body.health/body.maxHealth);const next=ratio>.66?0:ratio>.32?1:2;if(next===body.damageState)return;body.damageState=next;if(next===1){body.render.fillStyle=body.woodKind==='beam'?'#b96f31':'#965025';body.render.strokeStyle='#54270f'}else if(next===2){body.render.fillStyle=body.woodKind==='beam'?'#8e4e25':'#713918';body.render.strokeStyle='#321507';body.render.lineWidth=4}}\nfunction makeWoodFragment(source,x,y,w,h){const piece=Bodies.rectangle(x,y,w,h,{density:.0021,friction:.72,frictionStatic:.9,frictionAir:.012,restitution:.08,chamfer:{radius:4},render:{fillStyle:source.render.fillStyle,strokeStyle:'#3b1b0c',lineWidth:3}});piece.gameType='debris';piece.material='wood';piece.createdAt=performance.now();Body.setAngle(piece,source.angle);Body.setVelocity(piece,{x:source.velocity.x+(Math.random()-.5)*2.5,y:source.velocity.y-1-Math.random()*1.5});Body.setAngularVelocity(piece,source.angularVelocity+(Math.random()-.5)*.18);return piece}\nfunction breakWood(body,contact){if(!body||body.broken||!body.breakable)return;body.broken=true;const horizontal=body.woodKind==='beam',gap=5,partW=horizontal?(body.woodWidth-gap)/2:body.woodWidth,partH=horizontal?body.woodHeight:(body.woodHeight-gap)/2;const local=horizontal?{x:body.woodWidth*.26,y:0}:{x:0,y:body.woodHeight*.26};const c=Math.cos(body.angle),si=Math.sin(body.angle),offset={x:local.x*c-local.y*si,y:local.x*si+local.y*c};const a=makeWoodFragment(body,body.position.x-offset.x,body.position.y-offset.y,partW,partH),b=makeWoodFragment(body,body.position.x+offset.x,body.position.y+offset.y,partW,partH);World.remove(engine.world,body);World.add(engine.world,[a,b]);burst(contact?.x||body.position.x,contact?.y||body.position.y,18,'#c78342');impactRings.push({x:contact?.x||body.position.x,y:contact?.y||body.position.y,r:8,life:22,power:8});score+=body.isSupport?250:100;setStatus(body.isSupport?'Несущая опора сломана':'Дерево раскололось');updateHud()}\nfunction damageWood(body,power,contact){if(!body||body.material!=='wood'||!body.breakable||body.broken)return;const damage=Math.max(0,(power-2.2)*10.5);if(damage<4)return;body.health-=damage;updateWoodLook(body);burst(contact?.x||body.position.x,contact?.y||body.position.y,Math.min(10,3+Math.round(damage/9)),'#d6a065');if(body.health<=0||power>11.5)breakWood(body,contact)}\nfunction drawWoodDamage(ctx){for(const b of Composite.allBodies(engine.world)){if(b.material!=='wood'||!b.damageState||b.broken)continue;ctx.save();ctx.translate(b.position.x,b.position.y);ctx.rotate(b.angle);ctx.strokeStyle=b.damageState===1?'rgba(55,26,10,.75)':'rgba(35,12,4,.95)';ctx.lineWidth=b.damageState===1?2:3;const w=b.woodWidth,h=b.woodHeight;ctx.beginPath();if(b.woodKind==='beam'){ctx.moveTo(-w*.18,-h*.45);ctx.lineTo(-w*.08,0);ctx.lineTo(-w*.15,h*.45);if(b.damageState>1){ctx.moveTo(w*.12,-h*.45);ctx.lineTo(w*.03,-2);ctx.lineTo(w*.18,h*.45)}}else{ctx.moveTo(-w*.45,-h*.18);ctx.lineTo(0,-h*.06);ctx.lineTo(w*.45,-h*.14);if(b.damageState>1){ctx.moveTo(-w*.45,h*.12);ctx.lineTo(2,h*.03);ctx.lineTo(w*.45,h*.18)}}ctx.stroke();ctx.restore()}}"
          if marker not in s:
              raise SystemExit('Effects marker not found')
          s = s.replace(marker,extra)

          old_collision = "if(other.gameType==='target'&&power>2.2){defeatTarget(other);setStatus('Менеджер выбит')}else if(other.gameType==='structure'&&power>2.5){score+=Math.min(25,Math.round(power));setStatus('Сильный удар');updateHud()}"
          new_collision = "if(other.gameType==='target'&&power>2.2){defeatTarget(other);setStatus('Менеджер выбит')}else if(other.gameType==='structure'&&power>2.5){const c=pair.collision?.supports?.[0]||other.position;damageWood(other,power,c);score+=Math.min(25,Math.round(power));if(!other.broken)setStatus(other.damageState?'Дерево повреждено':'Сильный удар');updateHud()}"
          if old_collision not in s:
              raise SystemExit('Collision handler not found')
          s = s.replace(old_collision,new_collision)

          old_render = "Events.on(render,'afterRender',()=>{if(!anchor)return;const ctx=render.context;drawTrajectory(ctx);drawSlingshot(ctx);drawTargets(ctx);drawHero(ctx);drawEffects(ctx)});"
          new_render = "Events.on(render,'afterRender',()=>{if(!anchor)return;const ctx=render.context;drawTrajectory(ctx);drawSlingshot(ctx);drawWoodDamage(ctx);drawTargets(ctx);drawHero(ctx);drawEffects(ctx)});"
          if old_render not in s:
              raise SystemExit('Render handler not found')
          s = s.replace(old_render,new_render)

          path.write_text(s)
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/visual-game.js
          git commit -m "Add destructible wooden structures" || exit 0
          git push origin HEAD:agent/initial-rebuild
