name: Finalize sprite integration

on:
  push:
    branches:
      - agent/initial-rebuild
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/initial-rebuild
          fetch-depth: 0

      - name: Verify binary sprite asset
        shell: bash
        run: |
          set -euo pipefail
          test -s assets/sprites/office-birds-sprites.webp
          file assets/sprites/office-birds-sprites.webp | grep -qi webp

      - name: Connect asset directly and clean obsolete loaders
        shell: python
        run: |
          from pathlib import Path

          game_path = Path('src/visual-game.js')
          game = game_path.read_text(encoding='utf-8')
          marker = "const SPRITES={heroIdle:0,heroTension:1,heroFlying:2,heroStunned:3,bossIdle:4,bossSmug:5,bossPanic:6,bossDefeated:7};"
          direct_loader = marker + "\nconst officeBirdAtlas=new Image();\nofficeBirdAtlas.src='./assets/sprites/office-birds-sprites.webp';\nwindow.officeBirdAtlas=officeBirdAtlas;"
          if "officeBirdAtlas.src='./assets/sprites/office-birds-sprites.webp'" not in game:
              if marker not in game:
                  raise SystemExit('SPRITES marker not found')
              game = game.replace(marker, direct_loader, 1)
          game_path.write_text(game, encoding='utf-8')

          index_path = Path('index.html')
          index = index_path.read_text(encoding='utf-8')
          for line in (
              '  <script src="src/sprite-capture.js"></script>\n',
              '  <script src="src/sprite-capture-simple.js"></script>\n',
              '  <script src="src/sprite-bootstrap.js"></script>\n',
          ):
              index = index.replace(line, '')
          index_path.write_text(index, encoding='utf-8')

          for path in (
              'src/sprite-capture.js',
              'src/sprite-capture-simple.js',
              'src/sprite-bootstrap.js',
              'assets/sprites/office-birds-sprites.webp.base64',
              '.github/workflows/materialize-sprites.yml',
              '.github/workflows/finalize-sprite-integration.yml',
          ):
              Path(path).unlink(missing_ok=True)

      - name: Commit clean integration
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Use real sprite asset and remove temporary loaders"
          git push origin HEAD:agent/initial-rebuild
