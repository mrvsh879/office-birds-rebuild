name: Materialize sprite asset

on:
  push:
    branches:
      - agent/initial-rebuild
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/initial-rebuild
          fetch-depth: 0

      - name: Decode WebP sprite file
        shell: bash
        run: |
          set -euo pipefail
          test -f assets/sprites/office-birds-sprites.webp.base64
          base64 --decode assets/sprites/office-birds-sprites.webp.base64 > assets/sprites/office-birds-sprites.webp
          file assets/sprites/office-birds-sprites.webp
          test -s assets/sprites/office-birds-sprites.webp
          rm assets/sprites/office-birds-sprites.webp.base64

      - name: Commit binary asset
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/sprites/office-birds-sprites.webp assets/sprites/office-birds-sprites.webp.base64
          git commit -m "Materialize Office Birds sprite asset"
          git push origin HEAD:agent/initial-rebuild
