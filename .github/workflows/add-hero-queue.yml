name: Add hero queue

on:
  push:
    branches: [agent/initial-rebuild]
    paths: [.github/workflows/add-hero-queue.yml]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/initial-rebuild
      - name: Patch hero queue and respawn flow
        run: |
          python3 - <<'PY'
          from pathlib import Path

          game = Path('src/visual-game.js')
          s = game.read_text()
          if 'function drawHeroQueue(' in s:
              raise SystemExit(0)

          s = s.replace(
            "const { Engine, Render, Runner, World, Bodies, Events, Composite, Constraint, Mouse, MouseConstraint, Vector } = Matter;",
            "const { Engine, Render, Runner, World, Bodies, Body, Events, Composite, Constraint, Mouse, MouseConstraint, Vector } = Matter;"
          )

          s = s.replace(
            "let particles=[],impactRings=[],flash=0,heroStunnedUntil=0;",
            "let particles=[],impactRings=[],flash=0,heroStunnedUntil=0,heroSpawnAt=0;"
          )

          s = s.replace(
            "function createProjectile(){ball=Bodies.circle(anchor.x,anchor.y,34,{density:.004,restitution:.35,friction:.12,frictionAir:.004,render:{visible:false}});",
            "function createProjectile(){heroSpawnAt=performance.now();ball=Bodies.circle(anchor.x,anchor.y,34,{density:.004,restitution:.35,friction:.12,frictionAir:.004,render:{visible:false}});"
          )

          old_queue = "function queueProjectile(){if(respawnQueued||levelFinished)return;syncWoodDamage();respawnQueued=true;setTimeout(()=>{if(levelFinished)return;if(ball)World.remove(engine.world,ball);if(sling)World.remove(engine.world,sling);remainingShots()>0?createProjectile():finishLevel(false)},350)}"
          new_queue = "function queueProjectile(){if(respawnQueued||levelFinished)return;syncWoodDamage();respawnQueued=true;setStatus('Разрушения продолжаются…');setTimeout(()=>{if(levelFinished)return;if(ball)World.remove(engine.world,ball);if(sling)World.remove(engine.world,sling);ball=null;sling=null;if(aliveTargets()===0){finishLevel(true);return}if(remainingShots()>0){createProjectile();setStatus('Следующий герой готов')}else{finishLevel(false)}},1400)}"
          if old_queue not in s: raise SystemExit('queueProjectile not found')
          s = s.replace(old_queue,new_queue)

          old_defeat = "function defeatTarget(t){if(!t||t.defeated)return;t.defeated=true;t.defeatedAt=performance.now();score+=100;burst(t.position.x,t.position.y,16,'#f7c56d');updateHud();if(aliveTargets()===0)finishLevel(true)}"
          new_defeat = "function defeatTarget(t){if(!t||t.defeated)return;t.defeated=true;t.defeatedAt=performance.now();score+=100;burst(t.position.x,t.position.y,16,'#f7c56d');updateHud();if(aliveTargets()===0){setStatus('Все менеджеры сбиты');setTimeout(()=>finishLevel(true),1200)}}"
          if old_defeat not in s: raise SystemExit('defeatTarget not found')
          s = s.replace(old_defeat,new_defeat)

          marker = "function drawHero(ctx){if(!ball)return;let sprite=SPRITES.heroIdle,w=116,h=116,angle=ball.angle;"
          replacement = "function drawHeroQueue(ctx){const activeWaiting=ball&&!detached&&!respawnQueued?1:0;const waiting=Math.max(0,remainingShots()-activeWaiting);if(!waiting)return;const spacing=58,startX=Math.max(70,anchor.x-120-(waiting-1)*spacing),y=floorY-42;for(let i=0;i<waiting;i++){const x=startX+i*spacing;if(!drawSprite(ctx,SPRITES.heroIdle,x,y,52,64,0)){ctx.save();ctx.fillStyle='#26364a';ctx.beginPath();ctx.arc(x,y-5,18,0,Math.PI*2);ctx.fill();ctx.restore()}ctx.save();ctx.fillStyle='rgba(0,0,0,.18)';ctx.beginPath();ctx.ellipse(x,floorY-8,22,5,0,0,Math.PI*2);ctx.fill();ctx.restore()}}\nfunction drawHero(ctx){if(!ball)return;let sprite=SPRITES.heroIdle,w=116,h=116,angle=ball.angle;"
          if marker not in s: raise SystemExit('drawHero marker not found')
          s = s.replace(marker,replacement)

          old_draw = "if(!drawSprite(ctx,sprite,ball.position.x,ball.position.y,w,h,angle))drawFallbackHero(ctx)}"
          new_draw = "const spawnProgress=Math.min(1,(performance.now()-heroSpawnAt)/360),scale=.72+.28*(1-Math.pow(1-spawnProgress,3));w*=scale;h*=scale;if(!drawSprite(ctx,sprite,ball.position.x,ball.position.y,w,h,angle))drawFallbackHero(ctx)}"
          if old_draw not in s: raise SystemExit('drawHero ending not found')
          s = s.replace(old_draw,new_draw,1)

          old_render = "Events.on(render,'afterRender',()=>{if(!anchor)return;const ctx=render.context;drawTrajectory(ctx);drawSlingshot(ctx);drawWoodDamage(ctx);drawTargets(ctx);drawHero(ctx);drawEffects(ctx)});"
          new_render = "Events.on(render,'afterRender',()=>{if(!anchor)return;const ctx=render.context;drawTrajectory(ctx);drawHeroQueue(ctx);drawSlingshot(ctx);drawWoodDamage(ctx);drawTargets(ctx);drawHero(ctx);drawEffects(ctx)});"
          if old_render not in s: raise SystemExit('afterRender not found')
          s = s.replace(old_render,new_render)

          game.write_text(s)

          index = Path('index.html')
          html = index.read_text()
          html = html.replace('Запусков осталось','Героев осталось')
          html = html.replace('Оставшиеся персонажи','Оставшиеся герои')
          index.write_text(html)
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/visual-game.js index.html
          git commit -m "Add visible hero queue and delayed next shot" || exit 0
          git push origin HEAD:agent/initial-rebuild
