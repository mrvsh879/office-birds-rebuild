name: Apply structure stability

on:
  push:
    branches: [agent/initial-rebuild]
    paths: [.github/workflows/apply-structure-stability.yml]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/initial-rebuild
      - run: python3 tools/apply_structure_stability_patch.py
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/visual-game.js
          git commit -m "Stabilize tactical structures with breakable joints" || exit 0
          git push origin HEAD:agent/initial-rebuild
