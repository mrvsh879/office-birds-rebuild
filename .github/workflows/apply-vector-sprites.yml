name: Apply vector sprites
on:
  push:
    branches: [agent/visual-sprite-fix]
permissions:
  contents: write
jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/visual-sprite-fix
      - name: Switch sprite asset
        run: |
          sed -i "s#./assets/sprites/office-birds-sprites.webp#./assets/sprites/office-birds-vectors.svg#" src/visual-game.js
          rm -f .github/workflows/apply-vector-sprites.yml
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Use transparent vector character sprites"
          git push origin HEAD:agent/visual-sprite-fix
