name: Optimize game assets

on:
  pull_request:
    branches:
      - rebuild-v2-clean

permissions:
  contents: write

jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Optimize PNG assets
        run: |
          pip install pillow
          python - <<'PY'
          from pathlib import Path
          from PIL import Image

          roots = [
              Path('assets/materials'),
              Path('assets/props/office'),
              Path('assets/effects'),
              Path('assets/ui'),
          ]
          extra = [Path('assets/props/slingshots/slingshot-loaded.png')]
          paths = []
          for root in roots:
              paths.extend(sorted(root.rglob('*.png')))
          paths.extend(extra)

          total_before = 0
          total_after = 0
          for path in paths:
              if not path.exists():
                  continue
              total_before += path.stat().st_size
              image = Image.open(path).convert('RGBA')
              alpha = image.getchannel('A')
              bbox = alpha.point(lambda value: 255 if value > 16 else 0).getbbox()
              if bbox:
                  left, top, right, bottom = bbox
                  pad = 8
                  left = max(0, left-pad)
                  top = max(0, top-pad)
                  right = min(image.width, right+pad)
                  bottom = min(image.height, bottom+pad)
                  image = image.crop((left, top, right, bottom))
              max_side = 768
              scale = min(1.0, max_side / max(image.width, image.height))
              if scale < 1:
                  image = image.resize((max(1, round(image.width*scale)), max(1, round(image.height*scale))), Image.Resampling.LANCZOS)
              image.save(path, 'PNG', optimize=True, compress_level=9)
              total_after += path.stat().st_size
              print(f'{path}: {image.width}x{image.height}, {path.stat().st_size} bytes')
          print(f'TOTAL: {total_before} -> {total_after} bytes')
          PY
      - name: Commit optimized assets
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add assets
          git commit -m "Optimize PNG assets for faster loading" || exit 0
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
